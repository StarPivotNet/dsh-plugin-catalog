name = "dsh-plugin-catalog-notify"
main = "src/index.js"
compatibility_date = "2026-08-16"
workers_dev = true

[vars]
MAIL_FROM = "catalog@fastaicode.top"

# Custom domain after the Worker exists:
#   npx wrangler deploy
#   then attach catalog-notify.fastaicode.top in the dashboard or:
#   npx wrangler domains add catalog-notify.fastaicode.top
routes = [
  { pattern = "catalog-notify.fastaicode.top/*", zone_name = "fastaicode.top" }
]

[[send_email]]
name = "SEB"
