name: Refresh catalog versions

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: write
  members: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check listed packages against npm latest
        run: |
          set -o pipefail
          node scripts/refresh-catalog-versions.mjs 2>&1 | tee refresh.log
      - name: Commit catalog.json when a pin moved
        run: |
          set -o pipefail
          {
            git add catalog.json
            if git diff --cached --quiet; then
              echo 'No catalog.json changes'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "$(cat <<'EOF'
          chore(catalog): pin published npm versions

          Scheduled refresh of catalog.json against each listing's npm latest
          tag. Title, description, homepage, and kind are left unchanged.
          EOF
          )"
            git push
          } 2>&1 | tee commit.log
      - name: Prepare Chinese HTML failure mail
        if: failure()
        id: mail
        run: |
          {
            test -f refresh.log && { echo '--- 刷新 ---'; cat refresh.log; }
            test -f commit.log && { echo '--- 提交 ---'; cat commit.log; }
          } > failure.log || true
          REFRESH_FAILURE_LOG="$(cat failure.log 2>/dev/null || true)"
          export REFRESH_FAILURE_LOG
          node scripts/notify-refresh-failure.mjs
      - name: Email StarPivotNet members
        if: failure() && steps.mail.outputs.to != ''
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT || 587 }}
          secure: ${{ vars.SMTP_SECURE == 'true' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ steps.mail.outputs.to }}
          subject: ${{ steps.mail.outputs.subject }}
          html_body: file://failure-mail.html
          convert_markdown: false
